name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: Build
        run: ZIP=$(git log --name-only --format= --diff-filter=AM -- '*.zip' | head -n 1) && echo "Using $ZIP" && rm -rf proj && mkdir proj && unzip -q "$ZIP" -d proj && D=$(dirname $(find proj -name settings.gradle.kts | head -n 1)) && cd "$D" && gradle assembleDebug --no-daemon --stacktrace && cp $(find . -name app-debug.apk | head -n 1) "$GITHUB_WORKSPACE/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with: {name: app-debug, path: app-debug.apk}
      - uses: softprops/action-gh-release@v2
        with: {tag_name: "build-${{ github.run_number }}", name: "APK ${{ github.run_number }}", files: app-debug.apk}
