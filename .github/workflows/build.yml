name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "WARNING: KEYSTORE_BASE64 is missing; the APK will not have the stable signature."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/candle.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/candle.jks" >> "$GITHUB_ENV"

      - name: Select and build Android project
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          is_android_zip() {
            local names
            names="$(unzip -Z1 "$1")"
            grep -Eq '(^|/)settings\.gradle\.kts$' <<< "$names" || return 1
            grep -Eq '(^|/)app/build\.gradle\.kts$' <<< "$names" || return 1
          }

          selected=""
          best_time=-1
          for archive in *.zip; do
            [[ -f "$archive" ]] || continue
            if is_android_zip "$archive"; then
              commit_time="$(git log -1 --format=%ct -- "$archive" 2>/dev/null || echo 0)"
              commit_time="${commit_time:-0}"
              if (( commit_time >= best_time )); then
                best_time="$commit_time"
                selected="$archive"
              fi
            fi
          done

          if [[ -z "$selected" ]]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Selected archive: $selected"

          rm -rf project
          mkdir -p project
          unzip -q "$selected" -d project

          settings_file="$(find project -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$settings_file" ]]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          if [[ ! -f "$project_dir/app/build.gradle.kts" ]]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          cd "$project_dir"
          gradle assembleDebug --no-daemon --stacktrace

          apk_path="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$apk_path" "$GITHUB_WORKSPACE/app-debug.apk"
          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CANDLE-QUANT-APK-${{ github.run_number }}
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "CANDLE QUANT APK ${{ github.run_number }}"
          files: app-debug.apk
          fail_on_unmatched_files: true
