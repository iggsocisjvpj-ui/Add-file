
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Select and build Android project archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          preferred="CANDLE_QUANT_BUILD90_UPDATED.zip"
          selected=""

          is_android_project_zip() {
            local archive="$1"

            unzip -Z1 "$archive" |
              grep -Eq '(^|/)settings\.gradle\.kts$' || return 1

            unzip -Z1 "$archive" |
              grep -Eq '(^|/)app/build\.gradle\.kts$' || return 1
          }

          # اختيار مشروع Android وليس Apps Script
          if [[ -f "$preferred" ]] &&
             is_android_project_zip "$preferred"; then

            selected="$preferred"

          else

            best_time=-1

            for archive in *.zip; do
              [[ -f "$archive" ]] || continue

              if is_android_project_zip "$archive"; then

                commit_time="$(
                  git log -1 --format=%ct -- "$archive" 2>/dev/null || echo 0
                )"

                commit_time="${commit_time:-0}"

                if (( commit_time >= best_time )); then
                  best_time="$commit_time"
                  selected="$archive"
                fi

              fi
            done

          fi

          if [[ -z "$selected" ]]; then
            echo "ERROR: No Android project ZIP found."
            echo "Upload CANDLE_QUANT_BUILD90_UPDATED.zip"
            exit 1
          fi

          echo "Selected Android project: $selected"

          rm -rf project
          mkdir -p project

          unzip -q "$selected" -d project

          settings_file="$(
            find project -type f \
              -name settings.gradle.kts -print -quit
          )"

          if [[ -z "$settings_file" ]]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"

          if [[ ! -f "$project_dir/app/build.gradle.kts" ]]; then
            echo "ERROR: app/build.gradle.kts is missing."
            exit 1
          fi

          echo "Building from: $project_dir"

          cd "$project_dir"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          apk_path="$(
            find app/build/outputs/apk/debug \
              -type f -name '*.apk' -print -quit
          )"

          if [[ -z "$apk_path" ]]; then
            echo "ERROR: APK output was not created."
            exit 1
          fi

          cp "$apk_path" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CANDLE-QUANT-BUILD90-APK
          path: app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "CANDLE QUANT APK ${{ github.run_number }}"
          files: app-debug.apk
