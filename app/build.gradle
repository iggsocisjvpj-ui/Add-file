plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// توقيع ثابت من متغيرات البيئة في GitHub Actions، حتى يتحدّث التطبيق فوق النسخة القديمة دون حذف البيانات.
// إذا غابت المتغيرات يُستخدم مفتاح التصحيح العادي.
def ksPath = System.getenv('KEYSTORE_PATH')
def ksPass = System.getenv('KEYSTORE_PASSWORD')
def sAlias = System.getenv('KEY_ALIAS')
def sKeyPass = System.getenv('KEY_PASSWORD')
def hasStableKey = [ksPath, ksPass, sAlias, sKeyPass].every { it }

// رقم البناء يزيد مع كل تشغيل، وإلا يرفض أندرويد التحديث
def buildNum = (System.getenv('BUILD_NUMBER') ?: '0').toInteger() + 1000

android {
    namespace 'com.candleassistant.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.candleassistant.app'
        minSdk 24
        targetSdk 34
        versionCode buildNum
        versionName "3.${buildNum}"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasStableKey) {
            stable {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias sAlias
                keyPassword sKeyPass
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableKey) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasStableKey) {
                signingConfig signingConfigs.stable
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.1'
    implementation 'org.json:json:20240303'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
